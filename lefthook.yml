# Git hooks managed by lefthook. Install once after clone:
#   pnpm exec lefthook install
#
# Mirrors the validation gates CI enforces so failures surface
# locally rather than after a push round-trip. Recent CI breakages
# (PRs #236, #246) were typecheck errors — both would have been
# caught by `pre-push` here.

pre-commit:
  parallel: true
  commands:
    biome:
      # Only check files actually staged. Auto-fixes and re-stages so
      # the commit goes in clean. Matches `pnpm run lint` scope.
      glob: "{apps,packages}/**/*.{ts,tsx,js,jsx,json}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    claude-review:
      # Advisory staged-diff review by the Claude CLI (#465). This used
      # to live in a separate .pre-commit-config.yaml (Python pre-commit
      # framework) — but lefthook owns the git pre-commit hook, so that
      # file never actually ran. Folded in here and the second hook
      # manager dropped. The script self-skips when the `claude` CLI
      # isn't installed; bypass a run with CLAUDE_PRECOMMIT_SKIP=1.
      run: scripts/claude-precommit-review.sh

pre-push:
  # Sequential: install must finish before verify reads node_modules,
  # verify's build outputs are inputs to e2e's webServer launch, and
  # Playwright needs its browser binary before the suite runs.
  parallel: false
  commands:
    install:
      # Frozen-lockfile install mirrors CI's `pnpm install --frozen-lockfile`
      # step. Without it, a contributor whose node_modules still has
      # hoisted leftovers from a previous package manager can pass
      # verify locally while CI fails on a missing direct-dep
      # declaration (#346 caught this). Fast (<5s) when the lockfile
      # already matches.
      run: pnpm install --frozen-lockfile
    verify:
      # Full CI gate part 1: build → biome → typecheck → unit tests.
      run: pnpm run verify
    e2e-browser:
      # Playwright Chromium download. ~1s no-op when the build is cached,
      # ~90MB pull on a new machine — same as CI's
      # `playwright install chromium --with-deps`.
      run: pnpm --filter @loctx/web exec playwright install chromium
    e2e:
      # Full CI gate part 2: admin UI + API + MCP HTTP + Host/Origin
      # guard suite. ~15s on cached browser. The CI job name is
      # `lint + typecheck + test + e2e` — this command brings the
      # local gate to parity with that.
      run: pnpm --filter @loctx/web test:e2e
