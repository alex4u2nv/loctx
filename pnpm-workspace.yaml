packages:
  - "packages/*"
  - "apps/*"

# Single source of truth for versions shared across workspaces (#464).
# Referenced as `"<dep>": "catalog:"` in each package.json so the version
# lives here once — no more commander ^12 in eval vs ^15 in cli, or yaml
# ^2.6 vs ^2.9. Bump here to bump everywhere.
catalog:
  commander: ^15.0.0
  yaml: ^2.9.0
  "@modelcontextprotocol/sdk": ^1.29.0
  "@hono/node-server": ^1.19.14

# pnpm 9.15+ moved settings out of package.json's "pnpm" field. Postinstall
# scripts run only for explicitly trusted packages — anything else is
# visibly skipped at install time with a prompt to add it here. This list
# is therefore the supply-chain audit surface for build-time code execution.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@huggingface/transformers"
  - "@lancedb/lancedb"
  - "@parcel/watcher"
  - better-sqlite3
  - esbuild
  - lefthook
  - onnxruntime-node
  - protobufjs
  - sharp
  - tree-sitter
  - tree-sitter-go
  - tree-sitter-java
  - tree-sitter-javascript
  - tree-sitter-python
  - tree-sitter-rust
  - tree-sitter-typescript

# Grammar maintainers haven't aligned: tree-sitter-{go,java,javascript,typescript}
# declare peer tree-sitter@^0.21, tree-sitter-{python,rust} declare ^0.22.1.
# No single `tree-sitter` version satisfies all six. We pin 0.22.4 (the
# highest compatible with the most grammars); the ABI is stable across
# 0.21 ↔ 0.22 so the warning is cosmetic. Acknowledged here instead of
# polluting every `pnpm install` log.
peerDependencyRules:
  allowedVersions:
    tree-sitter: "0.22.x"
