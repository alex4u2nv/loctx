name: release

# Tag push (vX.Y.Z) triggers verify + publish. See CONTRIBUTING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # npm provenance attestation

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # cli + mcp resolve core through dist/, so build before verify.
        run: npm run build

      - name: Verify (lint + typecheck + test)
        run: npm run verify

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          for pkg in packages/core apps/cli apps/mcp; do
            v=$(node -p "require('./$pkg/package.json').version")
            if [ "$v" != "$tag" ]; then
              echo "::error::$pkg version $v does not match tag v$tag"
              exit 1
            fi
          done
          echo "All package versions match tag v$tag"

      - name: Publish @loctx/core
        run: npm publish --workspace @loctx/core --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @loctx/cli
        run: npm publish --workspace @loctx/cli --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @loctx/mcp
        run: npm publish --workspace @loctx/mcp --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          {
            echo "## Released v$tag"
            echo ""
            echo "Published to npm:"
            echo "- [@loctx/core](https://www.npmjs.com/package/@loctx/core)"
            echo "- [@loctx/cli](https://www.npmjs.com/package/@loctx/cli)"
            echo "- [@loctx/mcp](https://www.npmjs.com/package/@loctx/mcp)"
          } >> "$GITHUB_STEP_SUMMARY"
