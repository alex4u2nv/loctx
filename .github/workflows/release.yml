name: release

# Tag push (vX.Y.Z) builds self-contained tarballs for each supported
# platform + Node major and attaches them to the GitHub Release. Users
# install/update via scripts/install-release.sh (see README → Install).
#
# Why tarballs, not npm: the daemon loads the private @loctx/web build at
# runtime, and the artifact bundles the already-built native binaries — so
# users install with no build, no npm install, no compiler. Each tarball is
# platform + Node-ABI specific; the matrix below is the support set. (npm
# publishing can be added back here when/if loctx opens up to a registry.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create / upload release assets

jobs:
  tarball:
    name: tarball (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = arm64, macos-13 = x64, ubuntu-latest = x64.
        os: [macos-14, macos-13, ubuntu-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          v=$(node -p "require('./apps/cli/package.json').version")
          [ "$v" = "$tag" ] || { echo "::error::apps/cli version $v != tag v$tag"; exit 1; }

      - name: Build release tarball
        # release:build runs `pnpm run build` then scripts/build-release.mjs,
        # producing release/loctx-<version>-<platform>-<arch>-node<major>.tgz.
        run: pnpm run release:build

      - name: Upload tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/loctx-*.tgz
