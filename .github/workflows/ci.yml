name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: lint + typecheck + test + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit tree-sitter grammar pins
        # Native tree-sitter grammars execute during indexing — a
        # registry compromise on a floating version range could land
        # arbitrary code in the parser path. Refuse `^`/`~`/`*` ranges
        # in any `tree-sitter-*` dep across our own package.jsons
        # (transitive deps in node_modules aren't ours to control;
        # `npm ci` enforces the lock for those). See #178.
        run: |
          set -e
          loose=$(grep -REn --include=package.json --exclude-dir=node_modules \
              '"tree-sitter[^"]*":[[:space:]]*"[\^~*]' . || true)
          if [ -n "$loose" ]; then
            echo "Loose version range on a tree-sitter dep — pin it exactly:" >&2
            echo "$loose" >&2
            exit 1
          fi
          echo "tree-sitter deps are all exact-pinned"

      - name: Build all workspaces
        # @loctx/mcp + @loctx/web resolve @loctx/core through `dist/index.js`,
        # so the build must run before the test suite. apps/cli/dist/cli.js
        # and apps/web/dist/{client,server} are also pre-requisites for the
        # Playwright suite below — its webServer config spawns `loctx start`.
        run: npm run build

      - name: Verify (lint + typecheck + unit tests)
        run: npm run verify
        env:
          # apps/cli's integration test swaps to FakeEmbeddingProvider via
          # this env var on the spawned child. Keeping it unset at the top
          # level so library tests still exercise the default provider's
          # type contract.
          CI: "true"

      - name: Install Playwright browser
        # Chromium only — the admin UI tests don't need WebKit/Firefox.
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: E2E (Playwright)
        # Playwright config spawns its own `loctx start` against a fixture
        # workspace; it tests the full daemon stack — admin UI pages, the
        # /api/* surface, /mcp HTTP transport, and the host/origin guard.
        run: npm run test:e2e --workspace @loctx/web
        env:
          CI: "true"

      - name: Upload Playwright trace/screenshots on failure
        # Playwright config uses `trace: retain-on-failure` and
        # `screenshot: only-on-failure`; artifacts land under
        # `apps/web/test-results/`. Skip the upload silently when no
        # tests failed (the directory is missing or empty).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
