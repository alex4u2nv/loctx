name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

# A new push to the same branch/PR supersedes the in-flight run —
# cancel it instead of letting the 20-minute job finish. `github.ref`
# is unique per PR (refs/pull/N/merge) and per branch on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: we deliberately do NOT cache *.tsbuildinfo. Restoring a
      # buildinfo into a fresh checkout (which has no dist/) makes tsc
      # think a project is up to date and skip emitting its .d.ts — then
      # every dependent workspace fails with "Cannot find module
      # '@loctx/core'". The buildinfo now lives inside each project's
      # dist/ (tsBuildInfoFile), so its lifecycle is tied to the output;
      # a clean checkout is always a clean, correct build.

      - name: Audit tree-sitter grammar pins
        # Native tree-sitter grammars execute during indexing — a
        # registry compromise on a floating version range could land
        # arbitrary code in the parser path. Refuse `^`/`~`/`*` ranges
        # in any `tree-sitter-*` dep across our own package.jsons
        # (transitive deps in node_modules aren't ours to control;
        # pnpm's frozen-lockfile enforces the lock for those). See #178.
        run: |
          set -e
          loose=$(grep -REn --include=package.json --exclude-dir=node_modules \
              '"tree-sitter[^"]*":[[:space:]]*"[\^~*]' . || true)
          if [ -n "$loose" ]; then
            echo "Loose version range on a tree-sitter dep — pin it exactly:" >&2
            echo "$loose" >&2
            exit 1
          fi
          echo "tree-sitter deps are all exact-pinned"

      - name: Build all workspaces
        # @loctx/mcp + @loctx/web resolve @loctx/core through `dist/index.js`,
        # so the build must run before the test suite. apps/cli/dist/cli.js
        # and apps/web/dist/{client,server} are also pre-requisites for the
        # Playwright suite below — its webServer config spawns `loctx start`.
        run: pnpm run build

      - name: Lint + typecheck + unit tests
        # Deliberately NOT `pnpm run verify` — verify starts with a
        # build, and the build already ran in the previous step. Running
        # verify here compiled every workspace twice per CI run.
        run: pnpm run lint && pnpm run typecheck && pnpm test
        env:
          # apps/cli's integration test swaps to FakeEmbeddingProvider via
          # this env var on the spawned child. Keeping it unset at the top
          # level so library tests still exercise the default provider's
          # type contract.
          CI: "true"

      - name: Resolve Playwright version
        id: playwright-version
        # Cache key ingredient — the browser build is tied to the
        # @playwright/test version, nothing else.
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        # Chromium only — the admin UI tests don't need WebKit/Firefox.
        # ~90MB download, skipped entirely on a cache hit.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/web

      - name: Install Playwright OS dependencies
        # On a cache hit the browser binary is restored but the runner
        # image may still lack shared libraries — install-deps is a
        # fast no-op when everything is present.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: apps/web

      - name: E2E (Playwright)
        # Playwright config spawns its own `loctx start` against a fixture
        # workspace; it tests the full daemon stack — admin UI pages, the
        # /api/* surface, /mcp HTTP transport, and the host/origin guard.
        run: pnpm --filter @loctx/web test:e2e
        env:
          CI: "true"

      - name: Upload Playwright trace/screenshots on failure
        # Playwright config uses `trace: retain-on-failure` and
        # `screenshot: only-on-failure`; artifacts land under
        # `apps/web/test-results/`. Skip the upload silently when no
        # tests failed (the directory is missing or empty).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
